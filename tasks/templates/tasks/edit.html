
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        button, .back {
            padding: 11px 16px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        button {
            background: #2563eb;
            color: white;
        }
        .back {
            display: inline-block;
            background: #e2e8f0;
            color: #1e293b;
            margin-left: 8px;
        }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Task</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Task title</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="200"
                value="{{ task.title }}"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ task.description }}</textarea>

            <button type="submit">Save Changes</button>
            <a class="back" href="{% url 'home' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
